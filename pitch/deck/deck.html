<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TripAI – HackYeah 2026 pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=block">
<link rel="stylesheet" href="deck.css">
</head>
<body>

<!-- 1 HOOK -->
<section class="slide s-hook">
  <p class="script clay" data-t="hook.kicker"></p>
  <h1><span data-t="hook.t1"></span><br><em data-t="hook.t2"></em></h1>
  <p class="lede" data-t="hook.lede"></p>
  <p class="script clay who" data-t="hook.who"></p>
  <p class="foot">[Team name] · [Members]</p>
</section>

<!-- 2 MEET OLA -->
<section class="slide s-ola">
  <h2 data-t="ola.title"></h2>
  <div class="ola-grid">
    <div class="card persona">
      <p class="persona-name" data-t="ola.name"></p>
      <p class="persona-facts" data-t="ola.facts"></p>
      <p class="script clay quote" data-t="ola.quote"></p>
    </div>
    <div class="card today">
      <p class="card-h" data-t="ola.todayh"></p>
      <p data-t="ola.p1"></p>
      <p data-t="ola.p2"></p>
    </div>
  </div>
  <p class="stat" data-t="ola.stat"></p>
  <p class="gap" data-t="ola.gap"></p>
  <p class="foot" data-t="ola.src"></p>
</section>

<!-- 3 FREE DAYS IN, A CHECKABLE TRIP OUT -->
<section class="slide s-flow">
  <h2 data-t="flow.title"></h2>
  <div class="story">
    <figure><div class="phone"><img data-shot="dna" alt=""></div><figcaption><b data-t="flow.c1"></b><span data-t="flow.t1"></span></figcaption></figure>
    <figure><div class="phone"><img data-shot="confirm" alt=""></div><figcaption><b data-t="flow.c2"></b><span data-t="flow.t2"></span></figcaption></figure>
    <figure><div class="phone"><img data-shot="cards" alt=""></div><figcaption><b data-t="flow.c3"></b><span data-t="flow.t3"></span></figcaption></figure>
    <figure><div class="phone"><img data-shot="receipt-why" alt=""></div><figcaption><b data-t="flow.c4"></b><span data-t="flow.t4"></span></figcaption></figure>
  </div>
</section>

<!-- 4 EVERY NUMBER HAS A RECEIPT -->
<section class="slide s-receipt">
  <h2 data-t="rec.title"></h2>
  <div class="rec-body">
    <ul class="bullets">
      <li data-t="rec.b1"></li>

    </ul>
  <div class="trio">
    <figure class="zoomfig"><div class="zoom"><div class="crop" data-crop="receipt-sources:receiptCard"></div></div><figcaption data-t="rec.zoom"></figcaption></figure>
  </div>
  </div>
</section>

<!-- 5 TECH DECISIONS -->
<section class="slide s-tech">
  <h2 data-t="tech.title"></h2>
  <div class="tech-grid">
    <div class="cascade">
      <p class="col-h" data-t="tech.flowh"></p>
      <ol class="steps">
        <li><b data-t="tech.s2h"></b><span data-t="tech.s2"></span></li>
        <li class="acc"><b data-t="tech.s3h"></b><span data-t="tech.s3"></span></li>
        <li class="dash"><b data-t="tech.s4h"></b><span data-t="tech.s4"></span></li>
      </ol>
    </div>
    <div class="eval">
      <p class="col-h" data-t="tech.evalh"></p>
      <div class="bars">
        <div class="bar-row win"><span data-t="tech.e1"></span><div class="track"><i style="width:80%"></i></div><b>16/20</b></div>
        <div class="bar-row"><span data-t="tech.e2"></span><div class="track"><i style="width:70%"></i></div><b>14/20</b></div>
        <div class="bar-row"><span data-t="tech.e3"></span><div class="track"><i style="width:70%"></i></div><b>14/20</b></div>
        <div class="bar-row"><span data-t="tech.e4"></span><div class="track"><i style="width:50%"></i></div><b>10/20</b></div>
      </div>
      <p class="caveat" data-t="tech.caveat"></p>
      <p class="note" data-t="tech.evalnote"></p>
    </div>
  </div>
</section>

<!-- 6 WHY US / COMPETITORS -->
<section class="slide s-comp">
  <p class="script clay small" data-t="comp.kicker"></p>
  <h2 data-t="comp.title"></h2>
  <div class="comp-body">
  <div class="diffs">
    <div class="card"><p class="card-h" data-t="comp.d1h"></p><p data-t="comp.d1" data-scan="comp.d1n"></p></div>
    <div class="card"><p class="card-h" data-t="comp.d4h"></p><p data-t="comp.d4"></p></div>
    <div class="card"><p class="card-h" data-t="comp.d5h"></p><p data-t="comp.d5"></p></div>
  </div>
  </div>

  <p class="others" data-t="comp.others"></p>
</section>

<!-- 7 TEAM -->
<section class="slide s-team">
  <h2 data-t="team.title"></h2>
  <div class="team-grid">
    <div>
      <p class="team-name">[Team name] <span class="team-members">· [Members, roles]</span></p>
      <p class="why" data-t="team.why"></p>
      <p class="tested" data-t="team.tested"></p>
    </div>
    <div class="stats">
      <div><span class="big" data-v="tests"></span><span data-t="team.s2"></span></div>
      <div><span class="big" data-v="first"></span><span data-t="team.s3"></span></div>
    </div>
  </div>
  <p class="foot" data-t="team.ai"></p>
</section>

<!-- 8 BUSINESS + CLOSE -->
<section class="slide s-biz dark">
  <h2 data-t="biz.title"></h2>
  <div class="money">
    <div><b data-t="biz.m1h"></b><span data-t="biz.m1"></span></div>
    <div><b data-t="biz.m2h"></b><span data-t="biz.m2"></span></div>
    <div><b data-t="biz.m3h"></b><span data-t="biz.m3"></span></div>
  </div>
  <p class="answer" id="answer"></p>
  <p class="script peach cta" data-t="biz.cta"></p>
  <div class="try"><p class="foot"><span data-t="biz.try"></span> <span id="url"></span><br><span class="small" data-t="biz.foot"></span></p><div class="qr" id="qr"></div></div>
</section>

<script src="i18n.js"></script>
<script src="qr.js"></script>
<script src="shots/meta.js"></script>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'en';
  const T = window.DECK_I18N[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-t]').forEach((el) => {
    const v = T[el.dataset.t];
    if (v === undefined) { console.error('missing key', el.dataset.t); el.textContent = '⟦' + el.dataset.t + '⟧'; return; }
    el.innerHTML = v;
  });
  const NUM = window.DECK_I18N.numbers;
  document.querySelectorAll('[data-v]').forEach((el) => (el.textContent = NUM[el.dataset.v]));
  document.querySelectorAll('[data-shot]').forEach((el) => (el.src = `shots/${lang}-${el.dataset.shot}.png`));

  // Ola's #1 and the scan size, as the app showed them at capture time (shots/meta.json)
  const META = (window.SHOT_META || {})[lang] || {};
  const ans = document.getElementById('answer');
  // city + dates only: the deck never features a price
  if (META.top) ans.innerHTML = T['biz.answer'].replace('{top}', META.top.split(', ').slice(0, 2).join(', ')); else ans.remove();
  document.querySelectorAll('[data-scan]').forEach((el) => {
    if (META.scan) el.innerHTML = T[el.dataset.scan].replace('{w}', META.scan.windows).replace('{c}', META.scan.candidates);
  });

  // Zoomed crops of the real screenshots (rects recorded by shots.mjs, CSS px of a 390x844 viewport)
  document.querySelectorAll('[data-crop]').forEach((el) => {
    const [shot, key] = el.dataset.crop.split(':');
    const r = META[key];
    if (!r) { console.error('missing crop rect', key); return; }
    const x = r.x, y = r.y + 2, w = r.w, h = Math.min(r.h - 4, 175); // the flight + stay rows with their source chips
    const k = el.clientWidth / w;
    el.style.height = `${h * k}px`;
    el.style.backgroundImage = `url(shots/${lang}-${shot}.png)`;
    el.style.backgroundSize = `${390 * k}px auto`;
    el.style.backgroundPosition = `${-x * k}px ${-y * k}px`;
  });

  // Slide 8: the QR + URL appear only in a private build (TRIPAI_APP_URL set); the committed copy keeps the placeholder.
  if (window.DECK_QR) {
    document.getElementById('qr').innerHTML = window.DECK_QR;
    document.getElementById('url').textContent = window.DECK_URL;
  } else {
    document.getElementById('qr').innerHTML = '<div class="qr-ph">[QR]</div>';
    document.getElementById('url').textContent = '[app URL / QR]';
  }

  // phone screen: a status bar above each screenshot so the island never covers app UI
  const SB = '<div class="sb"><span>9:41</span><svg viewBox="0 0 70 14"><g fill="#111"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M28 5a10 10 0 0 1 14 0l-2 2a7 7 0 0 0-10 0zM31.5 8.5a5 5 0 0 1 7 0L35 12z"/><rect x="47" y="1" width="20" height="12" rx="3" fill="none" stroke="#111" stroke-width="1.5"/><rect x="49.5" y="3.5" width="15" height="7" rx="1.5"/><rect x="68" y="5" width="2" height="4" rx="1"/></g></svg></div>';
  document.querySelectorAll('.phone > img').forEach((img) => {
    const scr = document.createElement('div');
    scr.className = 'screen';
    img.replaceWith(scr);
    scr.innerHTML = SB;
    scr.appendChild(img);
  });
</script>
</body>
</html>
