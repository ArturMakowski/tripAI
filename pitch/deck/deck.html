<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TripAI – HackYeah 2026 pitch</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="deck.css">
</head>
<body>

<!-- 1 TITLE -->
<section class="slide s-hook dark">
  <h1><span data-t="hook.t1"></span><br><span class="pop" data-t="hook.t2"></span></h1>
  <p class="lede" data-t="hook.lede"></p>
  <p class="foot"><span data-t="hook.kicker"></span> · [Team name] · [Members]</p>
</section>

<!-- 2 OLA -->
<section class="slide s-ola">
  <p class="eyebrow" data-t="ola.name"></p>
  <h2 class="quote" data-t="ola.quote"></h2>
  <p class="facts" data-t="ola.facts"></p>
  <div class="stat-row">
    <p class="stat"><b>89%</b><span data-t="ola.s1"></span></p>
    <p class="stat"><b class="pop">12%</b><span data-t="ola.s2"></span></p>
  </div>
  <p class="foot" data-t="ola.src"></p>
</section>

<!-- 3 PRODUCT -->
<section class="slide s-flow">
  <div class="flow-copy">
    <h2 data-t="flow.title"></h2>
    <p class="body" data-t="flow.body"></p>
  </div>
  <div class="flow-phones">
    <div class="phone"><img data-shot="dna" alt=""></div>
    <div class="phone"><img data-shot="cards" alt=""></div>
  </div>
</section>

<!-- 4 RECEIPT -->
<section class="slide s-receipt">
  <div class="rec-copy">
    <h2 data-t="rec.title"></h2>
    <p class="body" data-t="rec.body"></p>
  </div>
  <div class="phone big"><img data-shot="receipt-sources" alt=""></div>
</section>

<!-- 5 HOW IT WORKS -->
<section class="slide s-how">
  <h2 data-t="how.title"></h2>
  <ol class="lines">
    <li data-t="how.s1"></li>
    <li data-t="how.s2"></li>
    <li data-t="how.s3"></li>
  </ol>
</section>

<!-- 6 HOW WE DIFFER -->
<section class="slide s-comp">
  <div class="comp-copy">
    <h2 data-t="comp.title"></h2>
    <p class="body" data-t="comp.body"></p>
    <p class="others" data-t="comp.others"></p>
  </div>
</section>

<!-- 7 BUSINESS -->
<section class="slide s-biz">
  <h2 data-t="biz.title"></h2>
  <div class="nums">
    <p><b data-t="biz.n1"></b><span data-t="biz.n1l"></span></p>
    <p><b class="pop" data-t="biz.n2"></b><span data-t="biz.n2l"></span></p>
    <p><b data-t="biz.n3"></b><span data-t="biz.n3l"></span></p>
  </div>
  <p class="foot" data-t="biz.rule"></p>
</section>

<!-- 8 CLOSE -->
<section class="slide s-close dark">
  <p class="cta" data-t="biz.cta"></p>
  <div class="try"><p class="foot"><span data-t="biz.try"></span> <span id="url"></span></p><div class="qr" id="qr"></div></div>
</section>

<script src="i18n.js"></script>
<script src="qr.js"></script>
<script src="shots/meta.js"></script>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'en';
  const T = window.DECK_I18N[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-t]').forEach((el) => {
    const v = T[el.dataset.t];
    if (v === undefined) { console.error('missing key', el.dataset.t); el.textContent = '⟦' + el.dataset.t + '⟧'; return; }
    el.innerHTML = v;
  });
  const NUM = window.DECK_I18N.numbers;
  document.querySelectorAll('[data-v]').forEach((el) => (el.textContent = NUM[el.dataset.v]));
  document.querySelectorAll('[data-shot]').forEach((el) => (el.src = `shots/${lang}-${el.dataset.shot}.png`));

  const META = (window.SHOT_META || {})[lang] || {};

  // Slide 8: the QR + URL appear only in a private build (TRIPAI_APP_URL set); the committed copy keeps the placeholder.
  if (window.DECK_QR) {
    document.getElementById('qr').innerHTML = window.DECK_QR;
    document.getElementById('url').textContent = window.DECK_URL;
  } else {
    document.getElementById('qr').innerHTML = '<div class="qr-ph">[QR]</div>';
    document.getElementById('url').textContent = '[app URL / QR]';
  }

  // phone screen: a status bar above each screenshot so the island never covers app UI
  const SB = '<div class="sb"><span>9:41</span><svg viewBox="0 0 70 14"><g fill="#111"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M28 5a10 10 0 0 1 14 0l-2 2a7 7 0 0 0-10 0zM31.5 8.5a5 5 0 0 1 7 0L35 12z"/><rect x="47" y="1" width="20" height="12" rx="3" fill="none" stroke="#111" stroke-width="1.5"/><rect x="49.5" y="3.5" width="15" height="7" rx="1.5"/><rect x="68" y="5" width="2" height="4" rx="1"/></g></svg></div>';
  document.querySelectorAll('.phone > img').forEach((img) => {
    const scr = document.createElement('div');
    scr.className = 'screen';
    img.replaceWith(scr);
    scr.innerHTML = SB;
    scr.appendChild(img);
  });
</script>
</body>
</html>
