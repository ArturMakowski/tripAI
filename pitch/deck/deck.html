<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TripAI – HackYeah 2026 pitch</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="deck.css">
</head>
<body>

<!-- 1 HOOK -->
<section class="slide s-hook">
  <p class="script clay" data-t="hook.kicker"></p>
  <h1><span data-t="hook.t1"></span><br><em data-t="hook.t2"></em></h1>
  <p class="lede" data-t="hook.lede"></p>
  <p class="foot">[Team name] · [Members]</p>
</section>

<!-- 2 MEET OLA -->
<section class="slide s-ola">
  <h2 data-t="ola.title"></h2>
  <div class="ola-grid">
    <div class="card persona">
      <p class="persona-name" data-t="ola.name"></p>
      <p class="persona-facts" data-t="ola.facts"></p>
      <p class="script clay quote" data-t="ola.quote"></p>
    </div>
    <div class="pains">
      <div class="card"><p class="card-h" data-t="ola.p1h"></p><p data-t="ola.p1"></p></div>
      <div class="card"><p class="card-h" data-t="ola.p2h"></p><p data-t="ola.p2"></p></div>
    </div>
  </div>
  <p class="stat" data-t="ola.stat"></p>
  <p class="foot" data-t="ola.src"></p>
</section>

<!-- 3 FLOW -->
<section class="slide s-flow">
  <h2 data-t="flow.title"></h2>
  <div class="story two">
    <figure><div class="phone"><img data-shot="dna" alt=""></div><figcaption><b data-t="flow.c1"></b><span data-t="flow.t1"></span></figcaption></figure>
    <figure><div class="phone"><img data-shot="cards" alt=""></div><figcaption><b data-t="flow.c2"></b><span data-t="flow.t2"></span></figcaption></figure>
  </div>
</section>

<!-- 4 RECEIPT -->
<section class="slide s-receipt">
  <h2 data-t="rec.title"></h2>
  <div class="rec-body">
    <ul class="bullets">
      <li data-t="rec.b1"></li>
      <li data-t="rec.b2"></li>
      <li data-t="rec.b3"></li>
    </ul>
    <figure class="zoomfig"><div class="zoom"><div class="crop" data-crop="receipt-sources:receiptCard"></div></div><figcaption data-t="rec.zoom"></figcaption></figure>
  </div>
</section>

<!-- 5 HOW IT WORKS -->
<section class="slide s-how">
  <h2 data-t="how.title"></h2>
  <div class="steps3">
    <div class="step"><span class="n">1</span><p class="card-h" data-t="how.s1h"></p><p data-t="how.s1"></p></div>
    <div class="arrow"></div>
    <div class="step"><span class="n">2</span><p class="card-h" data-t="how.s2h"></p><p data-t="how.s2"></p></div>
    <div class="arrow"></div>
    <div class="step acc"><span class="n">3</span><p class="card-h" data-t="how.s3h"></p><p data-t="how.s3"></p></div>
  </div>
  <p class="how-line" data-t="how.line"></p>
</section>

<!-- 6 HOW WE DIFFER -->
<section class="slide s-comp">
  <h2 data-t="comp.title"></h2>
  <div class="diffs">
    <div class="card"><p class="card-h" data-t="comp.d1h"></p><p data-t="comp.d1"></p></div>
    <div class="card"><p class="card-h" data-t="comp.d2h"></p><p data-t="comp.d2"></p></div>
    <div class="card"><p class="card-h" data-t="comp.d3h"></p><p data-t="comp.d3"></p></div>
  </div>
  <p class="others" data-t="comp.others"></p>
</section>

<!-- 7 BUSINESS -->
<section class="slide s-biz">
  <h2 data-t="biz.title"></h2>
  <div class="nums">
    <div><span class="big" data-t="biz.n1"></span><span data-t="biz.n1l"></span></div>
    <div><span class="big" data-t="biz.n2"></span><span data-t="biz.n2l"></span></div>
    <div><span class="big" data-t="biz.n3"></span><span data-t="biz.n3l"></span></div>
  </div>
  <p class="rule" data-t="biz.rule"></p>
</section>

<!-- 8 CLOSE -->
<section class="slide s-close dark">
  <p class="brand-close" data-t="hook.kicker"></p>
  <p class="script peach cta" data-t="biz.cta"></p>
  <div class="try"><p class="foot"><span data-t="biz.try"></span> <span id="url"></span></p><div class="qr" id="qr"></div></div>
</section>

<script src="i18n.js"></script>
<script src="qr.js"></script>
<script src="shots/meta.js"></script>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'en';
  const T = window.DECK_I18N[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-t]').forEach((el) => {
    const v = T[el.dataset.t];
    if (v === undefined) { console.error('missing key', el.dataset.t); el.textContent = '⟦' + el.dataset.t + '⟧'; return; }
    el.innerHTML = v;
  });
  const NUM = window.DECK_I18N.numbers;
  document.querySelectorAll('[data-v]').forEach((el) => (el.textContent = NUM[el.dataset.v]));
  document.querySelectorAll('[data-shot]').forEach((el) => (el.src = `shots/${lang}-${el.dataset.shot}.png`));

  const META = (window.SHOT_META || {})[lang] || {};

  // Zoomed crops of the real screenshots (rects recorded by shots.mjs, CSS px of a 390x844 viewport)
  document.querySelectorAll('[data-crop]').forEach((el) => {
    const [shot, key] = el.dataset.crop.split(':');
    const r = META[key];
    if (!r) { console.error('missing crop rect', key); return; }
    const x = r.x, y = r.y + 2, w = r.w, h = Math.min(r.h - 4, 175); // the flight + stay rows with their source chips
    const k = el.clientWidth / w;
    el.style.height = `${h * k}px`;
    el.style.backgroundImage = `url(shots/${lang}-${shot}.png)`;
    el.style.backgroundSize = `${390 * k}px auto`;
    el.style.backgroundPosition = `${-x * k}px ${-y * k}px`;
  });

  // Slide 8: the QR + URL appear only in a private build (TRIPAI_APP_URL set); the committed copy keeps the placeholder.
  if (window.DECK_QR) {
    document.getElementById('qr').innerHTML = window.DECK_QR;
    document.getElementById('url').textContent = window.DECK_URL;
  } else {
    document.getElementById('qr').innerHTML = '<div class="qr-ph">[QR]</div>';
    document.getElementById('url').textContent = '[app URL / QR]';
  }

  // phone screen: a status bar above each screenshot so the island never covers app UI
  const SB = '<div class="sb"><span>9:41</span><svg viewBox="0 0 70 14"><g fill="#111"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/><path d="M28 5a10 10 0 0 1 14 0l-2 2a7 7 0 0 0-10 0zM31.5 8.5a5 5 0 0 1 7 0L35 12z"/><rect x="47" y="1" width="20" height="12" rx="3" fill="none" stroke="#111" stroke-width="1.5"/><rect x="49.5" y="3.5" width="15" height="7" rx="1.5"/><rect x="68" y="5" width="2" height="4" rx="1"/></g></svg></div>';
  document.querySelectorAll('.phone > img').forEach((img) => {
    const scr = document.createElement('div');
    scr.className = 'screen';
    img.replaceWith(scr);
    scr.innerHTML = SB;
    scr.appendChild(img);
  });
</script>
</body>
</html>
